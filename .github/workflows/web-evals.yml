name: web-evals

# docs/agent-spec.md §12 and docs/design.md: the agent evals run only when the
# agent, its knowledge or the dataset change. They call the real models.
on:
  pull_request:
    paths:
      - "web/lib/ai/**"
      - "web/content/**"
      - "web/evals/**"
  push:
    branches: [main, next-rewrite]
    paths:
      - "web/lib/ai/**"
      - "web/content/**"
      - "web/evals/**"
  workflow_dispatch:

concurrency:
  group: web-evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      AI_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
      EMBEDDING_DIMENSIONS: ${{ secrets.EMBEDDING_DIMENSIONS }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      # Required by the agent runtime; evals never spend the visitor budget.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      AGENT_DAILY_BUDGET_USD: ${{ secrets.AGENT_DAILY_BUDGET_USD }}
      # Optional: with these, each run is published as a Langfuse dataset run.
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check secrets
        run: |
          for name in ANTHROPIC_API_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY EMBEDDING_API_KEY UPSTASH_REDIS_REST_URL; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done

      # Exits ≠ 0 when any §12 threshold fails.
      - run: pnpm evals

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: web/evals/report.json
          if-no-files-found: ignore
